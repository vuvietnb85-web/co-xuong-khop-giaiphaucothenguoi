<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>ATLAS CXK card</title>
    <link rel="stylesheet" href="/node_modules/@fontsource/oswald/600.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/source-sans-3/600.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #041018;
      }
      #stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #041018;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        display: block;
      }
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(ellipse 52% 80% at 74% 48%, rgba(0, 47, 108, 0.28), transparent 70%),
          linear-gradient(
            90deg,
            #041018 0%,
            rgba(4, 16, 24, 0.9) 30%,
            rgba(4, 16, 24, 0.28) 46%,
            rgba(4, 16, 24, 0) 58%
          );
        pointer-events: none;
      }
      .lockup {
        position: absolute;
        z-index: 2;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
        width: 700px;
        border-left: 3px solid #e8b00f;
        padding-left: 26px;
      }
      .word {
        margin: 0;
        font-family: Oswald, "Arial Narrow", sans-serif;
        font-weight: 600;
        font-size: 172px;
        line-height: 0.84;
        letter-spacing: 0.08em;
        color: #e8b00f;
      }
      .word + .word {
        margin-top: 8px;
      }
      .rule {
        width: 148px;
        height: 3px;
        margin: 26px 0 18px;
        background: #e8b00f;
      }
      .sub {
        margin: 0;
        max-width: 640px;
        font-family: "Source Sans 3", "Source Sans Pro", sans-serif;
        font-weight: 600;
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: 0.004em;
        color: #e6d7c3;
      }
      .fade {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: 0;
        height: 120px;
        background: linear-gradient(180deg, rgba(4, 16, 24, 0), #041018 92%);
        pointer-events: none;
      }
      .frame {
        position: absolute;
        z-index: 3;
        inset: 18px;
        border: 1px solid rgba(232, 176, 15, 0.92);
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="scrim"></div>
      <div class="fade"></div>
      <div class="lockup">
        <p class="word">ATLAS</p>
        <p class="word">CXK</p>
        <div class="rule"></div>
        <p class="sub">Giải phẫu cơ xương khớp</p>
      </div>
      <div class="frame"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "/node_modules/three/examples/jsm/loaders/GLTFLoader.js";
      import { DRACOLoader } from "/node_modules/three/examples/jsm/loaders/DRACOLoader.js";

      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.28;
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(1200, 630, false);
      renderer.setClearColor(0x041018, 1);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x041018);

      const camera = new THREE.PerspectiveCamera(32, 1200 / 630, 0.01, 100);

      scene.add(new THREE.HemisphereLight(0xe6d7c3, 0x041018, 0.55));
      const key = new THREE.DirectionalLight(0xfff6e8, 3.4);
      key.position.set(0.6, 1.8, 2.8);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xe8b00f, 2.6);
      rim.position.set(-2.6, 1.4, -1.2);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0x9eb6d4, 0.7);
      fill.position.set(2.2, 0.3, 1.8);
      scene.add(fill);

      const draco = new DRACOLoader();
      draco.setDecoderPath("/public/draco/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);

      function fail(err) {
        window.__error = String(err && err.message ? err.message : err);
        console.error(window.__error);
      }

      loader.load(
        "/public/models/body.glb",
        (gltf) => {
          const root = gltf.scene;
          root.traverse((obj) => {
            if (!obj.isMesh) return;
            const matName = String(obj.material?.name || "");
            const isMuscle = matName.includes("Muscle");
            obj.visible = !isMuscle;
            obj.frustumCulled = false;
            obj.material = new THREE.MeshStandardMaterial({
              color: 0xe6d7c3,
              roughness: 0.62,
              metalness: 0.02,
            });
          });

          const pivot = new THREE.Group();
          scene.add(pivot);
          pivot.add(root);

          const box = new THREE.Box3().setFromObject(root);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          root.position.sub(center);
          pivot.rotation.y = 0.42;

          const fitted = new THREE.Box3().setFromObject(pivot);
          const fsize = fitted.getSize(new THREE.Vector3());
          const fcenter = fitted.getCenter(new THREE.Vector3());
          window.__box = {
            size: size.toArray(),
            fitted: fsize.toArray(),
            center: fcenter.toArray(),
          };

          const headTop = fcenter.y + fsize.y * 0.5;
          const halfView = fsize.y * 0.46;
          const focusY = headTop + fsize.y * 0.11 - halfView;
          const dist = halfView / Math.tan(THREE.MathUtils.degToRad(16));
          camera.position.set(fcenter.x + fsize.x * 0.05, focusY, fcenter.z + dist);
          camera.lookAt(fcenter.x - fsize.x * 1.35, focusY, fcenter.z);
          camera.updateProjectionMatrix();

          renderer.render(scene, camera);
          requestAnimationFrame(() => {
            renderer.render(scene, camera);
            window.__ready = true;
          });
        },
        undefined,
        fail,
      );
    </script>
  </body>
</html>
